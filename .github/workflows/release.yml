name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish (e.g. v0.5.14)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to ClaHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          TAG_VERSION: ${{ inputs.tag || github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          npm install -g clawhub
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          SOURCE_COMMIT=$(git rev-parse HEAD)
          # Staging dir name = package name (clawhub derives it from basename when --name omitted).
          # Ship compiled output + manifests only (matches @openclaw/lobster's published shape).
          # Including index.ts/src triggers a clawhub validator complaint that's not satisfied
          # by sibling dist/ — published packages should be compiled-only.
          STAGE=/tmp/memex
          mkdir -p "$STAGE"
          cp SKILL.md README.md AGENTS.md CLAUDE.md package.json openclaw.plugin.json "$STAGE/"
          cp -r dist "$STAGE/dist"
          clawhub package publish "$STAGE" \
            --family code-plugin \
            --version "${TAG_VERSION#v}" \
            --source-repo "$SOURCE_REPO" \
            --source-commit "$SOURCE_COMMIT" \
            --source-ref "$TAG_VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
