name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)publish (e.g. v0.5.14)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to ClaHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          TAG_VERSION: ${{ inputs.tag || github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          npm install -g clawhub
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser
          SOURCE_COMMIT=$(git rev-parse HEAD)
          mkdir -p /tmp/memex-publish
          cp SKILL.md README.md AGENTS.md CLAUDE.md package.json openclaw.plugin.json index.ts /tmp/memex-publish/
          cp -r src/ /tmp/memex-publish/src/
          cp -r dist /tmp/memex-publish/dist
          echo "=== publish payload contents ==="
          ls -la /tmp/memex-publish
          echo "=== dist/ ==="
          ls -la /tmp/memex-publish/dist | head -20
          clawhub package publish /tmp/memex-publish \
            --family code-plugin \
            --version "${TAG_VERSION#v}" \
            --source-repo "$SOURCE_REPO" \
            --source-commit "$SOURCE_COMMIT" \
            --source-ref "$TAG_VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
